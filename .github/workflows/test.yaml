---
name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pre-commit-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Run pre-commit hooks
        shell: bash
        run: |
          nix develop --command prek run -a
